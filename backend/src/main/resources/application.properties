quarkus.application.name=rxflow-backend

# ── Database ──────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql

# dev: PostgreSQL started with `podman compose up -d` from the repository root
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rxflow
%dev.quarkus.datasource.username=rxflow
%dev.quarkus.datasource.password=rxflow

# test: Quarkus Dev Services starts a throwaway PostgreSQL container automatically

# prod: connection details come from environment variables
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate must never create or alter tables
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# ── API documentation ─────────────────────────────────────────────────────
quarkus.smallrye-openapi.info-title=RxFlow API
quarkus.smallrye-openapi.info-description=REST API for structured community pharmacy consultations
quarkus.swagger-ui.always-include=true
